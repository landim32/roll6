# Production environment (ASPNETCORE_ENVIRONMENT=Production), same layout as the other Emagine apps (AvaBot):
# HTTPS is terminated by Cloudflare and the server's shared nginx, which also serves the built SPA (frontend
# `npm run build` with .env.production → same-origin /api) and proxies /api and /hubs to roll6-api:8080 and /mcp to
# roll6-mcp:8080 over the shared external network "emagine-network". No port is published here, and the database is
# external (ROLL6_CONNECTION_STRING).
# Usage: docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d
# Fixed project name: containers and the internal network are prefixed "roll6" whatever the folder is called.
name: roll6

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roll6-api
    restart: unless-stopped
    # `docker logs roll6-api`: one line per request plus errors with the exception; rotated to keep the disk safe.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Roll6Context: ${ROLL6_CONNECTION_STRING}
      Jwt__Secret: ${ROLL6_JWT_SECRET}
      S3__Folder: roll6
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      Push__PublicKey: ${ROLL6_VAPID_PUBLIC_KEY:-}
      Push__PrivateKey: ${ROLL6_VAPID_PRIVATE_KEY:-}
    networks:
      - roll6-network
      # Shared network: the server's nginx reaches roll6-api:8080 (/api, /hubs) and the API reaches an external
      # database running on it.
      - emagine-network

  mcp:
    build:
      context: ./backend
      dockerfile: Roll6.Mcp/Dockerfile
    container_name: roll6-mcp
    restart: unless-stopped
    logging: *logging
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # MCP tools call the API with the caller's own API key; no database/storage secrets here.
      Roll6Api__BaseUrl: http://api:8080
    depends_on:
      - api
    networks:
      - roll6-network
      # Shared network: the server's nginx reaches roll6-mcp:8080 (/mcp).
      - emagine-network

networks:
  roll6-network:
    driver: bridge
  emagine-network:
    external: true
