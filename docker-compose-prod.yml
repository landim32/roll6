# Production environment (ASPNETCORE_ENVIRONMENT=Production).
# SSL is terminated by Caddy (automatic Let's Encrypt) in front of the web container (nginx serving the
# SPA and proxying /api to the API). The API and database are not exposed directly.
# Usage: docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simple-tabletop-map-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SimpleTabletopMapContext: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      S3__Folder: ${S3_FOLDER:-simple-tabletop}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simple-tabletop-map-network
      - simple-tabletop-map-external

  db:
    image: postgres:17-alpine
    container_name: simple-tabletop-map-db
    restart: unless-stopped
    # No port exposed externally — only reachable from the internal network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simple-tabletop-map-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: simple-tabletop-map-web
    restart: unless-stopped
    # Not exposed: only Caddy reaches it.
    depends_on:
      - api
    networks:
      - simple-tabletop-map-network

  caddy:
    image: caddy:2-alpine
    container_name: simple-tabletop-map-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - simple-tabletop-map-network
      - simple-tabletop-map-external

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  simple-tabletop-map-network:
    driver: bridge
  simple-tabletop-map-external:
    external: true
