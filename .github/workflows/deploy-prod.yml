name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        command_timeout: 30m
        script: |
          set -e

          DEPLOY_DIR="/opt/roll6"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"

          # Clone or update repository
          if [ -d "$DEPLOY_DIR" ]; then
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git clean -fd
          else
            echo "Cloning repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
          fi

          # The db container (official postgres image) needs user/password/database to create the database:
          # they are read from the connection string, so it is the only database secret.
          CONNECTION_STRING=$(cat <<'CSEOF'
          ${{ secrets.ROLL6_CONNECTION_STRING }}
          CSEOF
          )
          CONNECTION_STRING=$(echo "$CONNECTION_STRING" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          cs_value() {
            echo "$CONNECTION_STRING" | tr ';' '\n' \
              | grep -i -E "^[[:space:]]*($1)[[:space:]]*=" | head -n 1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          POSTGRES_USER=$(cs_value 'Username|User Id|UserId|User')
          POSTGRES_PASSWORD=$(cs_value 'Password|Pwd')
          POSTGRES_DB=$(cs_value 'Database|Initial Catalog')
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ] || [ -z "$POSTGRES_DB" ]; then
            echo "ROLL6_CONNECTION_STRING must contain Username, Password and Database." >&2
            exit 1
          fi

          # Inject .env.prod from GitHub Secrets (keep in sync with .env.prod.example)
          cat > .env.prod <<ENVEOF
          ROLL6_DOMAIN=${{ vars.ROLL6_DOMAIN }}
          ROLL6_CONNECTION_STRING=$CONNECTION_STRING
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          ENVEOF
          cat >> .env.prod <<'ENVEOF'
          ROLL6_JWT_SECRET=${{ secrets.ROLL6_JWT_SECRET }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENVEOF
          chmod 600 .env.prod

          # Remove leading whitespace from .env.prod
          sed -i 's/^[[:space:]]*//' .env.prod

          # Create external network if it doesn't exist
          docker network inspect roll6-external >/dev/null 2>&1 || docker network create roll6-external

          # Deploy with docker compose (migrations are applied by the API on startup)
          docker compose --env-file .env.prod -f docker-compose-prod.yml down
          docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d

          # Wait and verify
          echo "Waiting for services to start..."
          sleep 10
          docker compose --env-file .env.prod -f docker-compose-prod.yml ps

          # Drop dangling images left by the rebuild
          docker image prune -f

          echo "Deployment completed successfully."

    - name: Summary
      run: |
        echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Server: \`${{ secrets.PROD_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Domain: \`${{ vars.ROLL6_DOMAIN }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`main\`" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
