name: Deploy Production

# On demand only (Actions › Deploy Production › Run workflow); pushes to main no longer deploy.
on:
  workflow_dispatch:

# One deploy at a time; a newer run waits for the running one instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        command_timeout: 30m
        script: |
          set -e

          DEPLOY_DIR="/opt/roll6"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"

          # Clone or update repository
          if [ -d "$DEPLOY_DIR" ]; then
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git clean -fd
          else
            echo "Cloning repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
          fi

          # Inject .env.prod from GitHub Secrets (keep in sync with .env.prod.example)
          cat > .env.prod <<'ENVEOF'
          ROLL6_CONNECTION_STRING=${{ secrets.ROLL6_CONNECTION_STRING }}
          ROLL6_JWT_SECRET=${{ secrets.ROLL6_JWT_SECRET }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ROLL6_VAPID_PUBLIC_KEY=${{ secrets.ROLL6_VAPID_PUBLIC_KEY }}
          ROLL6_VAPID_PRIVATE_KEY=${{ secrets.ROLL6_VAPID_PRIVATE_KEY }}
          ENVEOF
          chmod 600 .env.prod

          # Remove leading whitespace from .env.prod
          sed -i 's/^[[:space:]]*//' .env.prod

          # Create external network if it doesn't exist
          docker network inspect emagine-network >/dev/null 2>&1 || docker network create emagine-network

          # Deploy with docker compose (migrations are applied by the API on startup)
          docker compose --env-file .env.prod -f docker-compose-prod.yml down
          docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d

          # Wait and verify
          echo "Waiting for services to start..."
          sleep 10
          docker compose --env-file .env.prod -f docker-compose-prod.yml ps

          # The shared nginx resolves roll6-api / roll6-mcp once, when its config loads; "down" + "up" gives the
          # containers new IPs on emagine-network, so without a reload /api may land on another container (404)
          # and /mcp on a dead one (502). Reload every nginx container attached to the shared network.
          for n in $(docker ps --filter network=emagine-network --format '{{.Names}} {{.Image}}' | awk 'tolower($2) ~ /nginx/ { print $1 }'); do
            echo "Reloading shared nginx: $n"
            docker exec "$n" nginx -s reload || echo "WARNING: could not reload $n"
          done

          # Drop dangling images left by the rebuild
          docker image prune -f

          echo "Deployment completed successfully."

    - name: Summary
      run: |
        echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Server: \`${{ secrets.PROD_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`main\`" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
