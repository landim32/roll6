name: Deploy Production

# Publica o Roll6 no cluster Kubernetes da DigitalOcean (do-nyc2-emagine-k8s, namespace roll6):
#   test → images (GHCR, tag sha-<commit>: roll6-api, roll6-mcp, roll6-web) → deploy (kubectl apply -k + rollout)
# Sob demanda (Actions › Deploy Production › Run workflow); pushes não publicam.
# A entrada pública (Cloudflare Tunnel + ingress-nginx compartilhados) é infra do cluster, aplicada
# pelo admin; esta pipeline só toca no namespace roll6 (credencial: ServiceAccount roll6-deployer).
# O SPA sai na imagem roll6-web (frontend/Dockerfile) — não depende mais do emagine-deploy.
# O job `manifests` valida os manifestos de deploy/k8s/ (roda mesmo com skip_tests).
#
# Segurança: secrets entram nos passos só por `env:` (nunca interpolados em `run:`), nenhum passo
# usa `set -x` nem imprime valores, e arquivos temporários ficam em $RUNNER_TEMP com umask 077.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou tag a publicar (ex.: main ou v1.2.0)"
        required: true
        default: main
      skip_tests:
        description: "Pular os testes (só para rollback de uma ref já testada)"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: roll6
  API_IMAGE: ghcr.io/landim32/roll6-api
  MCP_IMAGE: ghcr.io/landim32/roll6-mcp
  WEB_IMAGE: ghcr.io/landim32/roll6-web

jobs:
  test:
    name: Testes (backend e frontend)
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Backend — build e testes
        working-directory: backend
        run: |
          dotnet restore Roll6.sln
          dotnet build Roll6.sln --configuration Release --no-restore
          # Roll6.Console roda só no Windows do usuário (fake-claude.cmd, caminhos com \) e não vai para o
          # cluster: os testes dele ficam fora do runner Linux.
          dotnet test Roll6.sln --configuration Release --no-build --filter "FullyQualifiedName!~Roll6.Tests.Console"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — testes e build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  manifests:
    name: Validação dos manifestos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Renderizar o Kustomize
        run: kubectl kustomize "deploy/k8s/$NAMESPACE" > /dev/null

      - name: Sintaxe dos scripts
        run: |
          shopt -s nullglob
          for script in deploy/k8s/*/*.sh; do
            bash -n "$script"
          done

      - name: Nenhuma credencial em deploy/k8s/
        run: |
          set -euo pipefail
          failed=0

          # Padrões de credenciais conhecidos (token da DigitalOcean, chave privada, senha em
          # connection string). Só os nomes dos arquivos/linhas são mostrados.
          if grep -rnE 'dop_v1_|BEGIN .*PRIVATE KEY|Password=' deploy/k8s/; then
            echo "::error::deploy/k8s/ contém um padrão de credencial (dop_v1_, chave privada ou Password=)."
            failed=1
          fi

          # Nenhum Secret com dados versionado. O token da ServiceAccount em
          # bootstrap/deployer-rbac.yaml não tem `data`/`stringData` (o cluster preenche).
          while IFS= read -r -d '' file; do
            if awk '
              /^---/ { if (secret && hasdata) bad = 1; secret = 0; hasdata = 0; next }
              /^kind:[[:space:]]*Secret[[:space:]]*$/ { secret = 1 }
              /^(data|stringData):/ { hasdata = 1 }
              END { if (secret && hasdata) bad = 1; exit (bad ? 1 : 0) }
            ' "$file"; then
              :
            else
              echo "::error file=$file::Secret com data/stringData versionado em $file."
              failed=1
            fi
          done < <(find deploy/k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)

          exit "$failed"

  images:
    name: Imagens (GHCR)
    needs: test
    # Roda também quando `test` foi pulado (skip_tests), mas não quando falhou.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      reftag: ${{ steps.meta.outputs.reftag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Commit e tags
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=7 HEAD)"
          # Tag a partir da ref: '/' vira '-', só [A-Za-z0-9._-], sem começar com '.' ou '-',
          # no máximo 128 caracteres (regras de tag do registro).
          reftag="$(printf '%s' "$INPUT_REF" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          reftag="${reftag#"${reftag%%[!.-]*}"}"
          reftag="${reftag:0:128}"
          [[ -n "$reftag" ]] || reftag="ref-$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "reftag=$reftag" >> "$GITHUB_OUTPUT"
          echo "Commit: $sha · tag da ref: $reftag"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rollback rápido: se a imagem sha-<commit> já existe, o build é pulado.
      - name: Imagens já publicadas?
        id: exists
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          for pair in api:"$API_IMAGE" mcp:"$MCP_IMAGE" web:"$WEB_IMAGE"; do
            name="${pair%%:*}"
            image="${pair#*:}"
            if docker manifest inspect "$image:sha-$SHA" > /dev/null 2>&1; then
              echo "$image:sha-$SHA já existe — build pulado."
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Setup Buildx
        if: ${{ steps.exists.outputs.api != 'true' || steps.exists.outputs.mcp != 'true' || steps.exists.outputs.web != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build e push — API
        if: ${{ steps.exists.outputs.api != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.reftag }}
          cache-from: type=gha,scope=roll6-api
          cache-to: type=gha,mode=max,scope=roll6-api

      - name: Build e push — MCP
        if: ${{ steps.exists.outputs.mcp != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Roll6.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.MCP_IMAGE }}:${{ steps.meta.outputs.reftag }}
          cache-from: type=gha,scope=roll6-mcp
          cache-to: type=gha,mode=max,scope=roll6-mcp

      - name: Build e push — frontend
        if: ${{ steps.exists.outputs.web != 'true' }}
        uses: docker/build-push-action@v6
        # Build args são PÚBLICOS (vão para o navegador). VITE_API_URL vazio = mesma origem (o
        # ingress encaminha /api, /hubs e /mcp).
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.reftag }}
          cache-from: type=gha,scope=roll6-web
          cache-to: type=gha,mode=max,scope=roll6-web

  deploy:
    name: Deploy no Kubernetes
    needs: [images, manifests]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.manifests.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://roll6.site
    env:
      SHA: ${{ needs.images.outputs.sha }}
      REFTAG: ${{ needs.images.outputs.reftag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Antes de qualquer kubectl: falha cedo, com o nome do que falta, sem imprimir valores.
      # Para adicionar um secret obrigatório: inclua-o em `env:` deste passo e no `for pair` como
      # NOME_NO_GITHUB:VARIÁVEL. Secrets opcionais (VAPID) ficam fora da lista.
      - name: Validar secrets
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ROLL6_CONNECTION_STRING: ${{ secrets.ROLL6_CONNECTION_STRING }}
          ROLL6_JWT_SECRET: ${{ secrets.ROLL6_JWT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=0
          # "NOME_NO_GITHUB:VARIÁVEL_DE_AMBIENTE" (o KUBECONFIG usa outro nome no env para não
          # ser lido pelo kubectl como caminho de arquivo)
          for pair in \
            KUBECONFIG:KUBECONFIG_CONTENT \
            GHCR_PULL_USER:GHCR_PULL_USER \
            GHCR_PULL_TOKEN:GHCR_PULL_TOKEN \
            ROLL6_CONNECTION_STRING:ROLL6_CONNECTION_STRING \
            ROLL6_JWT_SECRET:ROLL6_JWT_SECRET \
            AWS_ACCESS_KEY_ID:AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY:AWS_SECRET_ACCESS_KEY; do
            name="${pair%%:*}"
            var="${pair#*:}"
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Secret/Variable $name não definido (repositório ou environment production)."
              missing=1
            fi
          done
          # Pelo menos 32 bytes (HMAC-SHA256).
          if [[ -n "${ROLL6_JWT_SECRET:-}" ]]; then
            jwt_bytes="$(printf '%s' "$ROLL6_JWT_SECRET" | wc -c)"
            if (( jwt_bytes < 32 )); then
              echo "::error::Secret ROLL6_JWT_SECRET precisa ter pelo menos 32 bytes."
              missing=1
            fi
          fi
          exit "$missing"

      - name: Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # Idempotente: create --dry-run=client -o yaml | apply. Valores só via env/arquivos
      # temporários (umask 077), nunca impressos.
      # Secret roll6-api-secrets: cada par CHAVE_NO_CLUSTER:VARIÁVEL vira uma variável de ambiente da API
      # (`__` = `:` na configuração do .NET; AWS_* são lidas pelo SDK). Variável vazia (VAPID não
      # cadastrado = notificações desligadas) fica de fora. Para adicionar um secret: inclua-o em `env:`
      # e na lista `for pair`; para remover, tire dos dois lugares (e da validação acima).
      - name: Secrets do cluster
        env:
          ROLL6_CONNECTION_STRING: ${{ secrets.ROLL6_CONNECTION_STRING }}
          ROLL6_JWT_SECRET: ${{ secrets.ROLL6_JWT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ROLL6_VAPID_PUBLIC_KEY: ${{ secrets.ROLL6_VAPID_PUBLIC_KEY }}
          ROLL6_VAPID_PRIVATE_KEY: ${{ secrets.ROLL6_VAPID_PRIVATE_KEY }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$RUNNER_TEMP/app-secrets"
          mkdir -p "$tmp"
          args=()
          for pair in \
            ConnectionStrings__Roll6Context:ROLL6_CONNECTION_STRING \
            Jwt__Secret:ROLL6_JWT_SECRET \
            AWS_ACCESS_KEY_ID:AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY:AWS_SECRET_ACCESS_KEY \
            Push__PublicKey:ROLL6_VAPID_PUBLIC_KEY \
            Push__PrivateKey:ROLL6_VAPID_PRIVATE_KEY; do
            key="${pair%%:*}"
            var="${pair#*:}"
            [[ -n "${!var:-}" ]] || continue
            printf '%s' "${!var}" > "$tmp/$key"
            args+=("--from-file=$key=$tmp/$key")
          done

          kubectl -n "$NAMESPACE" create secret generic roll6-api-secrets \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USER" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -rf "$tmp"

      # `kustomize edit set image` quando o kustomize está no runner; senão, sed sobre o bloco
      # `images` do kustomization.yaml (formato fixo). O resultado é conferido no YAML renderizado.
      - name: Definir as imagens (sha-${{ needs.images.outputs.sha }})
        working-directory: deploy/k8s/roll6
        run: |
          set -euo pipefail
          images=("$API_IMAGE" "$MCP_IMAGE" "$WEB_IMAGE")
          if command -v kustomize > /dev/null 2>&1; then
            for image in "${images[@]}"; do
              kustomize edit set image "$image=$image:sha-$SHA"
            done
          else
            echo "kustomize não encontrado no runner; usando sed no kustomization.yaml."
            for image in "${images[@]}"; do
              sed -i "\#- name: ${image}\$#{n;s#newTag: .*#newTag: sha-${SHA}#}" kustomization.yaml
            done
          fi
          rendered="$(kubectl kustomize .)"
          for image in "${images[@]}"; do
            if ! grep -qF "image: $image:sha-$SHA" <<< "$rendered"; then
              echo "::error::A imagem $image:sha-$SHA não aparece nos manifestos renderizados."
              exit 1
            fi
          done
          # `image` pode ser a 1ª chave do container (linha `- image:`)
          grep -E '^\s+(- )?image:' <<< "$rendered"

      - name: Aplicar os manifestos
        run: kubectl apply -k "deploy/k8s/$NAMESPACE"

      - name: Rollout — API
        run: kubectl -n "$NAMESPACE" rollout status deployment/roll6-api --timeout=10m

      - name: Rollout — MCP
        run: kubectl -n "$NAMESPACE" rollout status deployment/roll6-mcp --timeout=5m

      - name: Rollout — frontend
        run: kubectl -n "$NAMESPACE" rollout status deployment/roll6-web --timeout=5m

      # Diagnóstico do pod novo; o anterior segue atendendo (maxUnavailable: 0). Sem Secrets.
      - name: Diagnóstico da falha
        if: ${{ failure() }}
        run: |
          if [[ -z "${KUBECONFIG:-}" || ! -f "${KUBECONFIG}" ]]; then
            echo "Sem kubeconfig (a falha ocorreu antes do acesso ao cluster)."
            exit 0
          fi
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe deploy roll6-api roll6-mcp roll6-web || true
          kubectl -n "$NAMESPACE" describe pods -l 'app in (roll6-api,roll6-mcp,roll6-web)' || true
          kubectl -n "$NAMESPACE" logs -l app=roll6-api --tail=100 --all-containers --prefix || true
          kubectl -n "$NAMESPACE" logs -l app=roll6-mcp --tail=100 --all-containers --prefix || true
          kubectl -n "$NAMESPACE" logs -l app=roll6-web --tail=100 --all-containers --prefix || true

      - name: Resumo e limpeza
        if: ${{ always() }}
        env:
          INPUT_REF: ${{ inputs.ref }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          rm -f "$RUNNER_TEMP/kubeconfig"
          rm -rf "$RUNNER_TEMP/app-secrets"
          {
            echo "## Deploy de produção (Kubernetes)"
            echo ""
            echo "- Resultado: \`$JOB_STATUS\`"
            echo "- URL: https://roll6.site"
            echo "- Ref: \`$INPUT_REF\`"
            echo "- Commit: \`$SHA\`"
            echo "- Imagens: \`$API_IMAGE:sha-$SHA\`, \`$MCP_IMAGE:sha-$SHA\`, \`$WEB_IMAGE:sha-$SHA\`"
            echo "- Tag da ref (aplicada quando a imagem foi gerada nesta execução): \`$REFTAG\`"
            echo "- Disparado por: \`$ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
