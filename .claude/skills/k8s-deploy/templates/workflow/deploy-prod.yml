# Template k8s-deploy · placeholders: __APP__, __APP_PREFIX__, __DOMAIN__, __GHCR_OWNER__, __BACKEND_DIR__, __FRONTEND_DIR__ (ver SKILL.md).
name: Deploy Production

# Publica o projeto no cluster Kubernetes da DigitalOcean (do-nyc2-emagine-k8s, namespace __APP__):
#   test → images (GHCR, tag sha-<commit>) → deploy (kubectl apply -k + rollout status)
# A entrada pública (Cloudflare Tunnel + ingress-nginx compartilhados) é infra do cluster, aplicada
# pelo admin; esta pipeline só toca no namespace __APP__ (credencial: ServiceAccount __APP__-deployer).
# O job `manifests` valida os manifestos de deploy/k8s/ (roda mesmo com skip_tests).
#
# Segurança: secrets entram nos passos só por `env:` (nunca interpolados em `run:`), nenhum passo
# usa `set -x` nem imprime valores, e arquivos temporários ficam em $RUNNER_TEMP com umask 077.
#
# Projeto sem frontend (ou sem API): remova o build da imagem correspondente, a variável
# *_IMAGE, o rollout e as referências no diagnóstico/resumo.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou tag a publicar (ex.: main ou v1.2.0)"
        required: true
        default: main
      skip_tests:
        description: "Pular os testes (só para rollback de uma ref já testada)"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: __APP__
  API_IMAGE: ghcr.io/__GHCR_OWNER__/__APP__-api
  WEB_IMAGE: ghcr.io/__GHCR_OWNER__/__APP__-web

jobs:
  # ADAPTE AO PROJETO: troque os passos abaixo pelos testes/build reais da stack.
  test:
    name: Testes (backend e frontend)
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Exemplo .NET. Com mais de uma .sln/.csproj na pasta, passe a solução
      # (ex.: `dotnet test MinhaSolucao.sln ...`).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Backend — build e testes (adapte ao projeto)
        working-directory: __BACKEND_DIR__
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      # Exemplo Node (Vite/React etc.).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: __FRONTEND_DIR__/package-lock.json

      - name: Frontend — testes e build (adapte ao projeto)
        working-directory: __FRONTEND_DIR__
        run: |
          npm ci
          npm test
          npm run build

  manifests:
    name: Validação dos manifestos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Renderizar o Kustomize
        run: kubectl kustomize "deploy/k8s/$NAMESPACE" > /dev/null

      - name: Sintaxe dos scripts
        run: |
          shopt -s nullglob
          for script in deploy/k8s/*/*.sh; do
            bash -n "$script"
          done

      - name: Nenhuma credencial em deploy/k8s/
        run: |
          set -euo pipefail
          failed=0

          # Padrões de credenciais conhecidos (token da DigitalOcean, chave privada, senha em
          # connection string). Só os nomes dos arquivos/linhas são mostrados.
          if grep -rnE 'dop_v1_|BEGIN .*PRIVATE KEY|Password=' deploy/k8s/; then
            echo "::error::deploy/k8s/ contém um padrão de credencial (dop_v1_, chave privada ou Password=)."
            failed=1
          fi

          # Nenhum Secret com dados versionado. O token da ServiceAccount em
          # bootstrap/deployer-rbac.yaml não tem `data`/`stringData` (o cluster preenche).
          while IFS= read -r -d '' file; do
            if awk '
              /^---/ { if (secret && hasdata) bad = 1; secret = 0; hasdata = 0; next }
              /^kind:[[:space:]]*Secret[[:space:]]*$/ { secret = 1 }
              /^(data|stringData):/ { hasdata = 1 }
              END { if (secret && hasdata) bad = 1; exit (bad ? 1 : 0) }
            ' "$file"; then
              :
            else
              echo "::error file=$file::Secret com data/stringData versionado em $file."
              failed=1
            fi
          done < <(find deploy/k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)

          exit "$failed"

  images:
    name: Imagens (GHCR)
    needs: test
    # Roda também quando `test` foi pulado (skip_tests), mas não quando falhou.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Environment para ler build args do frontend guardados no environment `production`. Se houver
    # revisores obrigatórios, a aprovação é pedida aqui também. Sem build args de environment,
    # pode remover.
    environment:
      name: production
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      reftag: ${{ steps.meta.outputs.reftag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Commit e tags
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=7 HEAD)"
          # Tag a partir da ref: '/' vira '-', só [A-Za-z0-9._-], sem começar com '.' ou '-',
          # no máximo 128 caracteres (regras de tag do registro).
          reftag="$(printf '%s' "$INPUT_REF" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          reftag="${reftag#"${reftag%%[!.-]*}"}"
          reftag="${reftag:0:128}"
          [[ -n "$reftag" ]] || reftag="ref-$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "reftag=$reftag" >> "$GITHUB_OUTPUT"
          echo "Commit: $sha · tag da ref: $reftag"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rollback rápido: se a imagem sha-<commit> já existe, o build é pulado.
      - name: Imagens já publicadas?
        id: exists
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          for name in api web; do
            if [[ "$name" == "api" ]]; then image="$API_IMAGE"; else image="$WEB_IMAGE"; fi
            if docker manifest inspect "$image:sha-$SHA" > /dev/null 2>&1; then
              echo "$image:sha-$SHA já existe — build pulado."
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Setup Buildx
        if: ${{ steps.exists.outputs.api != 'true' || steps.exists.outputs.web != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build e push — API
        if: ${{ steps.exists.outputs.api != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: __BACKEND_DIR__
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.reftag }}
          cache-from: type=gha,scope=__APP__-api
          cache-to: type=gha,mode=max,scope=__APP__-api

      - name: Build e push — frontend
        if: ${{ steps.exists.outputs.web != 'true' }}
        uses: docker/build-push-action@v6
        # Build args são PÚBLICOS (vão para o navegador). VITE_API_URL vazio = mesma origem (o
        # ingress encaminha /api para a API). Para um build arg opcional vindo do GitHub, acrescente
        # uma linha ao bloco, por exemplo:
        #   VITE_GOOGLE_CLIENT_ID=${{ vars.__APP_PREFIX___GOOGLE_CLIENT_ID }}
        with:
          context: __FRONTEND_DIR__
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.reftag }}
          cache-from: type=gha,scope=__APP__-web
          cache-to: type=gha,mode=max,scope=__APP__-web

  deploy:
    name: Deploy no Kubernetes
    needs: [images, manifests]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.manifests.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://__DOMAIN__
    env:
      SHA: ${{ needs.images.outputs.sha }}
      REFTAG: ${{ needs.images.outputs.reftag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Antes de qualquer kubectl: falha cedo, com o nome do que falta, sem imprimir valores.
      # Para adicionar um secret obrigatório do projeto: inclua-o em `env:` deste passo e no
      # `for pair` como NOME_NO_GITHUB:VARIÁVEL. Secrets opcionais ficam fora da lista.
      - name: Validar secrets
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          __APP_PREFIX___CONNECTION_STRING: ${{ secrets.__APP_PREFIX___CONNECTION_STRING }}
          __APP_PREFIX___JWT_SECRET: ${{ secrets.__APP_PREFIX___JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          # "NOME_NO_GITHUB:VARIÁVEL_DE_AMBIENTE" (o KUBECONFIG usa outro nome no env para não
          # ser lido pelo kubectl como caminho de arquivo)
          for pair in \
            KUBECONFIG:KUBECONFIG_CONTENT \
            GHCR_PULL_USER:GHCR_PULL_USER \
            GHCR_PULL_TOKEN:GHCR_PULL_TOKEN \
            __APP_PREFIX___CONNECTION_STRING:__APP_PREFIX___CONNECTION_STRING; do
            name="${pair%%:*}"
            var="${pair#*:}"
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Secret/Variable $name não definido no environment production."
              missing=1
            fi
          done
          # Opcional, mas se existir precisa ter pelo menos 32 bytes (HMAC-SHA256).
          if [[ -n "${__APP_PREFIX___JWT_SECRET:-}" ]]; then
            jwt_bytes="$(printf '%s' "$__APP_PREFIX___JWT_SECRET" | wc -c)"
            if (( jwt_bytes < 32 )); then
              echo "::error::Secret __APP_PREFIX___JWT_SECRET precisa ter pelo menos 32 bytes."
              missing=1
            fi
          fi
          exit "$missing"

      - name: Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # Idempotente: create --dry-run=client -o yaml | apply. Valores só via env/arquivos
      # temporários (umask 077), nunca impressos.
      # Secret __APP__-api-secrets: cada par CHAVE_NO_CLUSTER:VARIÁVEL vira uma chave do Secret
      # (lida pela API como variável de ambiente; `__` = `:` na configuração do .NET). Variável
      # vazia (secret opcional não cadastrado) fica de fora. Para adicionar um secret: inclua-o em
      # `env:` e na lista `for pair`; para remover, tire dos dois lugares (e da validação acima).
      - name: Secrets do cluster
        env:
          __APP_PREFIX___CONNECTION_STRING: ${{ secrets.__APP_PREFIX___CONNECTION_STRING }}
          __APP_PREFIX___JWT_SECRET: ${{ secrets.__APP_PREFIX___JWT_SECRET }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$RUNNER_TEMP/app-secrets"
          mkdir -p "$tmp"
          args=()
          for pair in \
            ConnectionStrings__Default:__APP_PREFIX___CONNECTION_STRING \
            Jwt__Secret:__APP_PREFIX___JWT_SECRET; do
            key="${pair%%:*}"
            var="${pair#*:}"
            [[ -n "${!var:-}" ]] || continue
            printf '%s' "${!var}" > "$tmp/$key"
            args+=("--from-file=$key=$tmp/$key")
          done

          kubectl -n "$NAMESPACE" create secret generic __APP__-api-secrets \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USER" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -rf "$tmp"

      # `kustomize edit set image` quando o kustomize está no runner (vem nas imagens
      # ubuntu-latest do GitHub). Como isso não é garantido, há um fallback com sed sobre o bloco
      # `images` do kustomization.yaml (formato fixo, controlado por este repositório). Em ambos
      # os casos o resultado é conferido no YAML renderizado antes do apply.
      - name: Definir as imagens (sha-${{ needs.images.outputs.sha }})
        working-directory: deploy/k8s/__APP__
        run: |
          set -euo pipefail
          if command -v kustomize > /dev/null 2>&1; then
            kustomize edit set image "$API_IMAGE=$API_IMAGE:sha-$SHA"
            kustomize edit set image "$WEB_IMAGE=$WEB_IMAGE:sha-$SHA"
          else
            echo "kustomize não encontrado no runner; usando sed no kustomization.yaml."
            for image in "$API_IMAGE" "$WEB_IMAGE"; do
              sed -i "\#- name: ${image}\$#{n;s#newTag: .*#newTag: sha-${SHA}#}" kustomization.yaml
            done
          fi
          rendered="$(kubectl kustomize .)"
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            if ! grep -qF "image: $image:sha-$SHA" <<< "$rendered"; then
              echo "::error::A imagem $image:sha-$SHA não aparece nos manifestos renderizados."
              exit 1
            fi
          done
          grep -E '^\s+image:' <<< "$rendered"

      - name: Aplicar os manifestos
        run: kubectl apply -k "deploy/k8s/$NAMESPACE"

      - name: Rollout — API
        run: kubectl -n "$NAMESPACE" rollout status deployment/__APP__-api --timeout=10m

      - name: Rollout — frontend
        run: kubectl -n "$NAMESPACE" rollout status deployment/__APP__-web --timeout=10m

      # Diagnóstico do pod novo; o anterior segue atendendo (maxUnavailable: 0). Sem Secrets.
      - name: Diagnóstico da falha
        if: ${{ failure() }}
        run: |
          if [[ -z "${KUBECONFIG:-}" || ! -f "${KUBECONFIG}" ]]; then
            echo "Sem kubeconfig (a falha ocorreu antes do acesso ao cluster)."
            exit 0
          fi
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe deploy __APP__-api __APP__-web || true
          kubectl -n "$NAMESPACE" describe pods -l 'app in (__APP__-api,__APP__-web)' || true
          kubectl -n "$NAMESPACE" logs -l app=__APP__-api --tail=100 --all-containers --prefix || true
          kubectl -n "$NAMESPACE" logs -l app=__APP__-web --tail=100 --all-containers --prefix || true

      - name: Resumo e limpeza
        if: ${{ always() }}
        env:
          INPUT_REF: ${{ inputs.ref }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          rm -f "$RUNNER_TEMP/kubeconfig"
          rm -rf "$RUNNER_TEMP/app-secrets"
          {
            echo "## Deploy de produção (Kubernetes)"
            echo ""
            echo "- Resultado: \`$JOB_STATUS\`"
            echo "- URL: https://__DOMAIN__"
            echo "- Ref: \`$INPUT_REF\`"
            echo "- Commit: \`$SHA\`"
            echo "- Imagens: \`$API_IMAGE:sha-$SHA\`, \`$WEB_IMAGE:sha-$SHA\`"
            echo "- Tag da ref (aplicada quando a imagem foi gerada nesta execução): \`$REFTAG\`"
            echo "- Disparado por: \`$ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
