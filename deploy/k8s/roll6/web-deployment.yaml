# SPA do Roll6 servida pelo nginx da imagem frontend/Dockerfile (porta 80, mesmo nginx.conf da homologação:
# SSI das prévias de link, sw.js/manifest/version.json sem cache, /healthz). VITE_API_URL vazio na imagem =
# mesma origem. /api, /hubs e /mcp chegam do ingress direto à API/MCP; o `location /api/` do nginx só atende
# o SSI do index.html, pelo Service `api` (web-upstreams.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roll6-web
  labels:
    app: roll6-web
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: roll6-web
  template:
    metadata:
      labels:
        app: roll6-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # Tag definida pela pipeline (kustomization.yaml → images)
          image: ghcr.io/landim32/roll6-web
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
