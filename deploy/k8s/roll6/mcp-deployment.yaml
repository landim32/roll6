# Servidor MCP do Roll6 (020): gateway fino que chama a API com a chave do próprio cliente. Não tem banco,
# S3 nem segredos — só precisa saber onde está a API (Service roll6-api). Health em /health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roll6-mcp
  labels:
    app: roll6-mcp
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: roll6-mcp
  template:
    metadata:
      labels:
        app: roll6-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mcp
          # Tag definida pela pipeline (kustomization.yaml → images)
          image: ghcr.io/landim32/roll6-mcp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Roll6Api__BaseUrl
              value: http://roll6-api:8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
