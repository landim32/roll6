server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Image uploads go up to 10 MB (backend rule).
    client_max_body_size 11m;

    # Same-origin API: no CORS needed in homolog/production.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Real-time table events (SignalR): keep the WebSocket upgrade and long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP server for AI assistants (020, its own container): streamed responses, long requests, base64 uploads.
    location /mcp {
        proxy_pass http://mcp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 16m;
    }

    # Installable app (042): the service worker and the manifest are never cached, so every deploy is seen at once.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other route falls back to index.html (React Router).
    # ssi (040): index.html's include fills the link-preview tags of this page from /api/meta/head; the include uses
    # $request_uri because try_files has already rewritten $uri to /index.html.
    location / {
        ssi on;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
