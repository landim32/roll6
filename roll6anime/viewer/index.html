<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roll6anime</title>
  </head>
  <body>
    <canvas id="stage" aria-label="Prévia 3D do modelo"></canvas>
    <div class="bar">
      <button id="toggle" type="button" aria-label="Tocar" title="Tocar" disabled></button>
      <input id="range" type="range" min="0" max="1" step="0.01" value="0" aria-label="Andamento da animação" disabled />
      <span id="time">—</span>
      <span id="pose" class="pose" aria-live="off"></span>
      <button id="undo" class="toggle" type="button" aria-label="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)" disabled>↶ 0</button>
      <button id="redo" class="toggle" type="button" aria-label="Refazer (Ctrl+Y)" title="Refazer (Ctrl+Y)" disabled>↷ 0</button>
      <button id="skeleton" class="toggle" type="button" aria-pressed="false" aria-label="Mostrar o esqueleto" title="Mostrar o esqueleto" disabled>Esqueleto</button>
    </div>
    <div id="bone-label" class="bone-label" hidden></div>
    <div id="edit-status" class="edit-status" hidden></div>
    <div id="skeleton-note" class="skeleton-note" hidden>Este modelo não tem esqueleto.</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
