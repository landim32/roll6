# Homolog environment (ASPNETCORE_ENVIRONMENT=Docker). No SSL; ports exposed for testing.
# Usage: docker compose up --build -d   (reads .env)
# Frontend: http://localhost:${WEB_PORT} (nginx proxies /api to the api service; no CORS needed).
# API/Swagger directly: http://localhost:${APP_PORT}/swagger
# Fixed project name: containers, network and volumes are prefixed "roll6" whatever the folder is called.
name: roll6

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roll6-api
    ports:
      - "${APP_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Roll6Context: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      S3__BucketName: ${S3_BUCKET_NAME}
      S3__Region: ${S3_REGION}
      S3__ServiceUrl: ${S3_SERVICE_URL}
      S3__Folder: ${S3_FOLDER:-roll6}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - roll6-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: roll6-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - roll6-network

  db:
    image: postgres:17-alpine
    container_name: roll6-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - roll6-network

volumes:
  postgres_data:

networks:
  roll6-network:
    driver: bridge
